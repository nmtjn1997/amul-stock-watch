# Back in Stock: the hosted, multi-user edition of Amul Stock Watch.
# Deploy steps and limits: ../docs/HOSTED.md
name = "amul"
main = "src/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true   # so every page also gets the security headers

# Cloudflare Workers Logs: every console line, searchable in the dashboard (free tier keeps
# 3 days). The admin Monitor tab keeps its own 7 to 30 days in D1.
[observability]
enabled = true
head_sampling_rate = 1

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "amul-watch"
database_id = "ef6beaeb-f968-460d-9a00-a551a32b70be"
migrations_dir = "migrations"

# Pre-auth flood control for login and sign-up, keyed per network. Costs no D1 writes.
[[ratelimits]]
name = "AUTH_LIMIT"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[vars]
# Help page sections. "true" shows them; anything else hides them, and their links and
# payment details are then left out of what the browser receives (the QR returns 404).
SHOW_OPEN_SOURCE = "false"
SHOW_SUPPORT = "false"
REPO_URL = "https://github.com/nmtjn1997/amul-stock-watch"
UPI_ID = "nmtjn1997@okhdfcbank"
UPI_NAME = "Namit Jain"
MAX_USERS = "100"
MAX_WATCHES_PER_USER = "10"
MAX_PINCODES_PER_USER = "3"
# This account can never be disabled, demoted or deleted, by anyone.
OWNER_USERNAME = "namitjain"
# Cloudflare Turnstile human check on sign-up. The matching TURNSTILE_SECRET is a
# secret (wrangler secret put TURNSTILE_SECRET); without it the check is off.
TURNSTILE_SITE_KEY = "0x4AAAAAAFKOxvHLEErz8Yjz"
NTFY_SERVER = "https://ntfy.sh"
# Browser push: this public key goes to browsers; the private half is the secret
# VAPID_PRIVATE_JWK (wrangler secret put VAPID_PRIVATE_JWK). Optional NTFY_TOKEN secret:
# an ntfy.sh account token, so ntfy alerts are not limited by the shared free quota.
VAPID_PUBLIC_KEY = "BNZeu15wJyvop1ypLSbWD1fLxP1a7vTkV9J11yfyp4_xYeEJQHGFfh5ZCWXgcQZbtzxqq8E7XPO6ziUXfzlFUM4"
VAPID_SUBJECT = "https://github.com/nmtjn1997/amul-stock-watch"
# Google accounts with these emails become admins on first sign-in (comma separated).
ADMIN_EMAILS = ""
# Set GOOGLE_CLIENT_ID here and GOOGLE_CLIENT_SECRET + SESSION_SECRET as secrets to turn
# on "Sign in with Google" (wrangler secret put GOOGLE_CLIENT_SECRET).
GOOGLE_CLIENT_ID = ""
