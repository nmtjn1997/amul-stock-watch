name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: CLI smoke test
        shell: bash
        run: |
          export AMUL_WATCH_HOME="$RUNNER_TEMP/amul-home"
          amul-watch init
          amul-watch alerts
          amul-watch simulate stock --pincode 110001 --dry-run

  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install.sh from the checkout
        if: runner.os != 'Windows'
        run: |
          bash scripts/install.sh
          ~/.local/bin/amul-watch --help >/dev/null || amul-watch --help >/dev/null
      - name: install.ps1 from the checkout
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/install.ps1
          & "$env:LOCALAPPDATA\amul-watch\bin\amul-watch.cmd" doctor; if ($LASTEXITCODE -gt 1) { exit 1 }
          & "$env:LOCALAPPDATA\amul-watch\bin\amul-watch.cmd" paths

  cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: syntax check the Worker and its UI
        run: for f in cloud/src/*.js cloud/public/*.js; do node --check "$f"; done

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t amul-stock-watch .
      - run: docker run --rm amul-stock-watch amul-watch --help
